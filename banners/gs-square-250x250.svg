<svg xmlns="http://www.w3.org/2000/svg" width="250" height="250" viewBox="0 0 250 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041f16"/>
      <stop offset="50%" stop-color="#0A5C4A"/>
      <stop offset="100%" stop-color="#22A87E"/>
    </linearGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <clipPath id="clip"><rect width="250" height="250"/></clipPath>
  </defs>

  <rect width="250" height="250" fill="url(#bg)"/>

  <!-- Rings -->
  <circle cx="125" cy="125" r="105" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1" clip-path="url(#clip)"/>
  <circle cx="125" cy="125" r="80" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="1" clip-path="url(#clip)"/>
  <circle cx="230" cy="20" r="90" fill="rgba(255,255,255,0.04)" clip-path="url(#clip)"/>

  <!-- Logo -->
  <text x="125" y="80" font-family="Georgia, 'Times New Roman', serif" font-size="28" font-weight="700" fill="rgba(255,255,255,0.95)" text-anchor="middle" letter-spacing="-1">Gradim<tspan fill="rgba(255,255,255,0.38)">Se</tspan></text>

  <!-- Divider dot row -->
  <circle cx="103" cy="98" r="2" fill="rgba(255,255,255,0.25)"/>
  <circle cx="113" cy="98" r="2" fill="rgba(255,255,255,0.25)"/>
  <circle cx="125" cy="98" r="2" fill="rgba(255,255,255,0.25)"/>
  <circle cx="137" cy="98" r="2" fill="rgba(255,255,255,0.25)"/>
  <circle cx="147" cy="98" r="2" fill="rgba(255,255,255,0.25)"/>

  <!-- Headline -->
  <text x="125" y="126" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="-0.2">Skupnost pravih</text>
  <text x="125" y="144" font-family="Georgia, 'Times New Roman', serif" font-size="14.5" font-style="italic" fill="rgba(255,255,255,0.85)" text-anchor="middle" letter-spacing="-0.2">podjetnikov.</text>

  <!-- Stat -->
  <text x="125" y="172" font-family="Georgia, serif" font-size="26" font-style="italic" fill="white" text-anchor="middle">240+</text>
  <text x="125" y="188" font-family="Arial, sans-serif" font-size="8.5" fill="rgba(255,255,255,0.45)" text-anchor="middle" letter-spacing="1.5">AKTIVNIH ČLANOV</text>

  <!-- CTA -->
  <rect x="32" y="208" width="186" height="28" rx="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="125" y="227" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.3">gradimse.si →</text>
</svg>
