<svg xmlns="http://www.w3.org/2000/svg" width="300" height="250" viewBox="0 0 300 250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#063d2c"/>
      <stop offset="55%" stop-color="#0A5C4A"/>
      <stop offset="100%" stop-color="#1a9e72"/>
    </linearGradient>
    <linearGradient id="cardbg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.11)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)"/>
    </linearGradient>
    <clipPath id="clip"><rect width="300" height="250"/></clipPath>
  </defs>

  <rect width="300" height="250" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="270" cy="-20" r="100" fill="rgba(255,255,255,0.05)" clip-path="url(#clip)"/>
  <circle cx="-20" cy="220" r="120" fill="rgba(255,255,255,0.04)" clip-path="url(#clip)"/>
  <circle cx="150" cy="300" r="80" fill="rgba(34,168,126,0.2)" clip-path="url(#clip)"/>

  <!-- Logo -->
  <text x="24" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.95)" letter-spacing="-0.5">Gradim</text>
  <text x="112" y="48" font-family="Georgia, 'Times New Roman', serif" font-size="22" font-weight="700" fill="rgba(255,255,255,0.42)" letter-spacing="-0.5">Se</text>

  <!-- Tagline -->
  <text x="24" y="78" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="rgba(255,255,255,0.85)" letter-spacing="-0.2">Skupnost pravih</text>
  <text x="24" y="98" font-family="Georgia, 'Times New Roman', serif" font-size="15" font-style="italic" fill="rgba(255,255,255,0.85)" letter-spacing="-0.2">podjetnikov.</text>

  <!-- Divider -->
  <line x1="24" y1="118" x2="276" y2="118" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>

  <!-- Stats cards -->
  <rect x="24" y="132" width="76" height="58" rx="10" fill="url(#cardbg)"/>
  <rect x="24" y="132" width="76" height="58" rx="10" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="62" y="158" font-family="Georgia, serif" font-size="18" font-style="italic" fill="white" text-anchor="middle">240+</text>
  <text x="62" y="178" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="0.5">ČLANOV</text>

  <rect x="112" y="132" width="76" height="58" rx="10" fill="url(#cardbg)"/>
  <rect x="112" y="132" width="76" height="58" rx="10" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="150" y="158" font-family="Georgia, serif" font-size="18" font-style="italic" fill="white" text-anchor="middle">52+</text>
  <text x="150" y="178" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="0.5">DELAVNIC</text>

  <rect x="200" y="132" width="76" height="58" rx="10" fill="url(#cardbg)"/>
  <rect x="200" y="132" width="76" height="58" rx="10" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="238" y="158" font-family="Georgia, serif" font-size="18" font-style="italic" fill="white" text-anchor="middle">€2M+</text>
  <text x="238" y="178" font-family="Arial, sans-serif" font-size="8" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="0.5">PROMET</text>

  <!-- CTA Button -->
  <rect x="24" y="208" width="252" height="28" rx="14" fill="rgba(255,255,255,0.15)"/>
  <rect x="24" y="208" width="252" height="28" rx="14" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1"/>
  <text x="150" y="227" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle" letter-spacing="0.4">Brezplačno se pridruži →</text>
</svg>
